<!DOCTYPE html>
<html>
    <head>
        <meta charset='UTF-8' />
        <meta http-equiv='Cache-Control' content='no-cache, no-store, must-revalidate' />
        <meta http-equiv='Pragma' content='no-cache' />
        <meta http-equiv='Expires' content='0' />
        <title>MSE Re-buffering test</title>
        <style>
          video {
              top: 100px;
              left: 100px;
              width: 420px;
              height: 210px;
              position: absolute;
          }
          body {
              margin:0;
              padding:0;
              background-color:transparent;
              overflow: hidden;
          }
        </style>
    </head>
    <body>
        <script type='text/javascript'>
          const baseUrl = 'https://storage.googleapis.com/ytlr-cert.appspot.com/test-materials/media/'
          let video = null

          document.addEventListener('DOMContentLoaded', function() {
              setTimeout(startApp, 0)
          })

          function appendChunk(sourceBuffer, url, chunk, reject) {
              try {
                  sourceBuffer.appendBuffer(chunk)
              } catch (e) {
                  if (e.code == DOMException.QUOTA_EXCEEDED_ERR) {
                      setTimeout(() => {
                          appendChunk(sourceBuffer, url, chunk, reject)
                      }, 500)
                  } else {
                      console.log('appendToBuffer error: ' + e.code)
                      reject()
                  }
              }
          }

          function appendLoop(sourceBuffer, resolve, reject,  url, offset, chunksize, filesize) {
              if (offset >= filesize) {
                  resolve()
                  return
              }
              if (sourceBuffer.buffered.length && sourceBuffer.appendWindowEnd - sourceBuffer.buffered.end(0) < 0.01) {
                  resolve()
                  return
              }
              sourceBuffer.addEventListener('updateend', function onUpdateEnd() {
                  offset += chunksize + 1
                  appendLoop(sourceBuffer, resolve, reject, url, offset, chunksize, filesize)
                  var buffStr = ''
                  for (var i = 0; i < sourceBuffer.buffered.length; ++i)
                      buffStr +=  (i == 0 ? '[' : ', [') + sourceBuffer.buffered.start(i) + ', ' + sourceBuffer.buffered.end(i) + ']'
                  console.log('Append completed: buffered = ' + buffStr + ', ct = ' + video.currentTime + ', url = ' + url)
              }, {once: true})
              console.log('fetchAndAppend: ' + url + ', bytes=' + offset + '-' + Math.min(offset + chunksize, filesize))
              let xhr = new XMLHttpRequest()
              xhr.open('GET', url)
              xhr.setRequestHeader('Range', 'bytes=' + offset + '-' + Math.min(offset + chunksize, filesize));
              xhr.responseType = 'arraybuffer'
              xhr.onload = (e) => {
                  if (xhr.status != 206 && xhr.status != 200) {
                      let err = 'Load failed. Unexpected status code ' + xhr.status + ' for ' + url
                      console.log(err)
                      reject(err)
                      return
                  }
                  appendChunk(sourceBuffer, url, new Uint8Array(xhr.response), reject)
              }
              xhr.send()
          }

          function createAppendLoop(sourceBuffer, url, offset, chunksize, filesize) {
              return new Promise((resolve, reject) => {
                  appendLoop(sourceBuffer, resolve, reject,  url, offset, chunksize, filesize)
              })
          }

          function cleanupAndReload() {
             video.removeAttribute('src')
             video.load()
             video.remove()
             video = null

             let params = new URLSearchParams(location.search);
             let n = parseInt(params.get('n') || '10')
             if (n < 10) {
                 params.set('n', n + 1)
                 location.search = params
             } else {
                 console.log('Test finished.')
             }
         }

         async function startApp() {
             video = document.createElement('video')
             video.addEventListener('timeupdate', () => {
                 const quality = video.getVideoPlaybackQuality()
                 console.log('Total frames: ' + quality.totalVideoFrames + ', dropped: ' + (quality.corruptedVideoFrames + quality.droppedVideoFrames) + ', ct: ' + video.currentTime + ', rate: ' + video.playbackRate)
             })
             document.body.appendChild(video)
             let ms = new MediaSource()
             await new Promise((resolve, reject) => {
                 ms.addEventListener('sourceopen', function onSourceOpen() {
                     console.log('onSourceOpen()')
                     resolve()
                 }, {once: true})
                 video.src = window.URL.createObjectURL(ms)
             })
             let videoSb = ms.addSourceBuffer('video/mp4; codecs="avc1.64002a"')
             let audioSb = ms.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"')

             await playStream(ms, videoSb, audioSb, {
                 playbackRate: 1.0,
                 video: {
                     url: 'big-buck-bunny-h264-720p-30fps.mp4',
                     filesize: 18229067
                 },
                 audio: {
                     url: 'car-20120827-8c.mp4',
                     filesize: 2884572
                 }
             })
             /**/
             await playStream(ms, videoSb, audioSb, {
                 playbackRate: 1.0,
                 video: {
                     url: 'shorts/shorts.f134.mp4',  // big-buck-bunny-h264-1080p-60fps.mp4
                     filesize: 18229067
                 },
                 audio: {
                     url: 'car-20120827-8c.mp4',
                     filesize: 2884572
                 }
             })
             cleanupAndReload()
          }

          async function playStream(ms, videoSb, audioSb, stream) {
             let p = new Promise ((resolve, reject) => {
                 video.addEventListener('ended', () => {
                     resolve()
                 }, {once: true})
                 video.addEventListener('canplaythrough', () => {
                     video.playbackRate = stream.playbackRate || 1.0
                     video.play()
                 }, {once: true})
                 video.addEventListener('error', () => {
                     console.error ('video error: ' + video.error)
                 }, {once: true})
             })

             const currentDuration = ms.duration || 0
             const newDuration = currentDuration + 10

             if (ms.readyState === "ended") {
               // reopen
               videoSb.timestampOffset = currentDuration
               audioSb.timestampOffset = currentDuration
               // reset parser state
               videoSb.abort();
               audioSb.abort();
             }

             videoSb.appendWindowEnd = newDuration
             audioSb.appendWindowEnd = newDuration

             ms.duration = newDuration

             let videoP = createAppendLoop(videoSb, baseUrl + stream.video.url, 0, 206217952, stream.video.filesize)
             let audioP = createAppendLoop(audioSb, baseUrl + stream.audio.url, 0, 1024 * 1024, stream.audio.filesize)

             await Promise.all([videoP, audioP])

             ms.endOfStream()

             return p
         }
        </script>
    </body>
</html>
